<!DOCTYPE html>
<html lang="so">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kiro-Maal Real Estate</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0B1728;
        color: #F5F1E8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(214, 165, 54, 0.35);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(214, 165, 54, 0.16);
        border: 1px solid rgba(214, 165, 54, 0.45);
        color: #D6A536;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        color: #FFFFFF;
        margin-bottom: 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.55;
        color: #CBD5E1;
        margin-bottom: 24px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 20px;
        background: linear-gradient(90deg, #D6A536, #E5BE5C, #C29124);
        color: #0B1728;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Kiro-Maal Real Estate</div>
      <h1>Connecting to Kiro-Maal</h1>
      <p>
        Please ensure you have an active internet connection to load live verified properties and your account dashboard.
      </p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
